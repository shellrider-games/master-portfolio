{{ define "head" }}
<meta name="description" content="Imprint of {{ .Site.Title }}">
<link rel="stylesheet" href="{{ (printf "%scss/single.css" (.Site.Params.staticPath | default "")) | relURL }}" media="all">
{{ end }}

{{ define "title" }}
{{ .Title }} | {{ .Site.Title }}
{{ end }}

{{ define "main" }}
<section id="single">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-12 col-md-12 col-lg-9">
                <div class="title mb-5">
                    <h1 class="text-center mb-4">{{ .Title }}</h1>
                </div>
                <article class="page-content p-2">
                    {{ .Content }}
                </article>
            </div>
        </div>
    </div>
</section>
{{ end }}
